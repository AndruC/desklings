# Builds desklings.exe on Windows and publishes a GitHub Release whenever a tag like v1.2.3 is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, to check the tag is on main

      - name: Check the tag is on main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that isn't on main"
            exit 1
          fi

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(cargo pkgid | sed -E 's/.*[#@]//')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - name: Test
        run: |
          cargo test --release --locked
          cargo test --locked

      - name: Build
        run: cargo build --release --locked

      # Created as a draft and only made public once the exe is attached, so nobody sees a
      # release without its download.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/release
          sha256sum desklings.exe > desklings.exe.sha256
          # Safe to re-run while it's still a draft; a published release is never modified.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Release $GITHUB_REF_NAME is already published; refusing to replace its files"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" desklings.exe desklings.exe.sha256 --clobber
          else
          gh release create "$GITHUB_REF_NAME" desklings.exe desklings.exe.sha256 --draft \
            --title "Desklings $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Download **desklings.exe** below and run it. No installer needed; it saves to \`%APPDATA%\desklings\`.

          Windows may show a SmartScreen warning because the exe isn't code-signed: click **More info → Run anyway**."
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
