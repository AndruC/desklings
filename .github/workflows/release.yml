# Builds desklings.exe on Windows and publishes a GitHub Release whenever a tag like v1.2.3 is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/desklings.exe \
            --title "Desklings $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Download **desklings.exe** below and run it. No installer needed; it saves to \`%APPDATA%\desklings\`.

          Windows may show a SmartScreen warning because the exe isn't code-signed: click **More info → Run anyway**."
