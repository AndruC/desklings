# Runs the tests on every push to main and every pull request: on current stable Rust, on the
# oldest version Cargo.toml promises to support, and as a debug build (overflow checks and debug
# assertions on). Also validates the sprite art with the preview tool.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - toolchain: stable
            profile: --release
          - toolchain: "1.80"
            profile: --release
          - toolchain: stable
            profile: "" # debug: overflow checks and debug_assert! enabled
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust ${{ matrix.toolchain }}
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal

      - name: Test
        run: cargo +${{ matrix.toolchain }} test ${{ matrix.profile }} --locked

  sprites:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate sprites
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python tools/sprite_sheet.py src/sprites.rs "$RUNNER_TEMP/sprites.png"
